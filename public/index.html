<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一行ニュース — 一行で、五紙を読む。</title>
    <script>
      // テーマとフォントサイズは描画前に適用し、ちらつきを防ぐ（設定は localStorage の ichigyo:* ）
      try {
        // テーマプリセット（2026-11-16〜）: ichigyo:themePreset に
        // kami（紙）/ koshi（古紙）/ shirokuro（白黒）/ akari（灯）/ sumi（墨）/
        // system（端末）を保存する。
        // 旧キー（ichigyo:theme / ichigyo:accent）しか無い場合はここで移行する
        // （ダーク→墨、端末→system、それ以外→紙。アクセント単独設定は廃止）。
        var PRESETS = ['kami', 'koshi', 'shirokuro', 'akari', 'sumi', 'system']
        var p = localStorage.getItem('ichigyo:themePreset')
        if (PRESETS.indexOf(p) < 0) {
          var old = localStorage.getItem('ichigyo:theme')
          p = old === 'dark' ? 'sumi' : old === 'system' ? 'system' : 'kami'
          try {
            localStorage.setItem('ichigyo:themePreset', p)
            localStorage.removeItem('ichigyo:theme')
            localStorage.removeItem('ichigyo:accent')
          } catch (e2) {
            /* 移行の保存に失敗しても表示は続ける */
          }
        }
        var resolved =
          p === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'sumi'
              : 'kami'
            : p
        document.documentElement.dataset.theme = resolved
        document.documentElement.dataset.fontSize =
          localStorage.getItem('ichigyo:fontSize') || 'medium'
      } catch (e) {
        /* 読めなければ既定（紙／中）で表示する */
      }
    </script>
    <script type="module" crossorigin src="/assets/index-9YA8bBi5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-wmee5uXN.css">
  </head>

    <div id="root"></div>
  </body>
</html>
