<!doctype html>
<html lang="ja">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一行ニュース — 一行で、五紙を読む。</title>
    <script>
      // テーマとフォントサイズは描画前に適用し、ちらつきを防ぐ（設定は localStorage の ichigyo:* ）
      try {
        var t = localStorage.getItem('ichigyo:theme') || 'light'
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.fontSize =
          localStorage.getItem('ichigyo:fontSize') || 'medium'
      } catch (e) {
        /* 読めなければ既定（ライト／中）で表示する */
      }
    </script>
